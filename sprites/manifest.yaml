manifestVersion: 1
name: "@josh/sprites"
version: "2026.09.11.1"
description: |
  Swamp models for Fly.io Sprites: organizations, named Sprites, services,
  checkpoints, task holds, and connectors. Sprite methods cover execution,
  files, policies, and network access, and list the Sprite's services,
  checkpoints, and tasks.

  The organization token determines the scope of each model. Sprite mutations
  require a saved identity and reject a replacement with the same name. Exec
  saves an `exec` record and binary `execStdout` and `execStderr` files.

  ## Models

  | Model type | Description |
  | --- | --- |
  | `@josh/sprites/organization` | The token's Fly organization and its Sprite and connector lists. |
  | `@josh/sprites/sprite` | One named Sprite: execution, files, policies, and networking. |
  | `@josh/sprites/service` | One Sprite service: definition, lifecycle, logs, and signal. |
  | `@josh/sprites/checkpoint` | One named slot holding a Sprite checkpoint. |
  | `@josh/sprites/task` | One task hold on a Sprite. |
  | `@josh/sprites/connector` | One organization connection: policy and OAuth. |

  ## Requirements

  - An organization token stored in a Swamp vault.
  - `/.sprite/bin/python3` inside the Sprite for sized TTY commands and the TCP proxy.

  ## Usage

  Store the token in an existing vault, configure a model, create the remote
  Sprite, and run a command:

  ```sh
  swamp vault put sprites-secrets API_TOKEN
  swamp model create @josh/sprites/sprite build-sprite \
    --global-arg name=build-worker \
    --global-arg 'token=${{ vault.get("sprites-secrets", "API_TOKEN") }}'
  swamp model method run build-sprite create
  swamp model method run build-sprite exec --input '{"cmd":["python3","-c","print(6 * 7)"]}'
  ```
repository: https://github.com/joshuadavidthomas/sprite-swamp

models:
  - organization.ts
  - sprite.ts
  - service.ts
  - checkpoint.ts
  - task.ts
  - connector.ts

additionalFiles:
  - LICENSE
  - README.md

platforms: []
labels:
  - fly.io
  - sprites
